        <button class="btn btn-ghost btn-sm" data-mup="${i}" ${i===0?'disabled':''} style="flex:0 0 auto">▲</button>
        <button class="btn btn-ghost btn-sm" data-mdn="${i}" ${i===dm.messages.length-1?'disabled':''} style="flex:0 0 auto">▼</button>
        <button class="btn btn-danger btn-sm" data-mdel="${i}" style="flex:0 0 auto">삭제</button>
      </div>`;
    /* 보낸 사람이 바뀌면 좌·우 위치도 바로 따라가도록 다시 그린다 */
    ed.querySelector('[data-mf="from"]').onchange=e=>{ m.fromId = e.target.value; save(); renderDMMsgEditors(dm,dmid); };
    const prev = ed.querySelector('[data-prev]');
    const refreshPrev = ()=>{ prev.innerHTML = esc(stampOf(m)) || '<span style="color:#c3ccd4">날짜·시간 없음</span>'; };
    ed.querySelector('[data-mf="date"]').oninput=e=>{ m.date=e.target.value; save(); refreshPrev(); };
    ed.querySelector('[data-mf="time"]').oninput=e=>{ m.time=e.target.value; save(); refreshPrev(); };
    ed.querySelector('[data-mf="text"]').oninput=e=>{ m.text=e.target.value; save(); };
    ed.querySelector('[data-mimg]').onclick=()=> pickImage(680, url=>{ m.image=url; save(); renderDMMsgEditors(dm,dmid); });
    const del=ed.querySelector('[data-mimgdel]'); if(del) del.onclick=()=>{ m.image=''; save(); renderDMMsgEditors(dm,dmid); };
    ed.querySelector('[data-mdel]').onclick=()=>{ dm.messages.splice(i,1); save(); renderDMMsgEditors(dm,dmid); };
    ed.querySelector('[data-mup]').onclick=()=>{ if(i>0){ [dm.messages[i-1],dm.messages[i]]=[dm.messages[i],dm.messages[i-1]]; save(); renderDMMsgEditors(dm,dmid);} };
    ed.querySelector('[data-mdn]').onclick=()=>{ if(i<dm.messages.length-1){ [dm.messages[i+1],dm.messages[i]]=[dm.messages[i],dm.messages[i+1]]; save(); renderDMMsgEditors(dm,dmid);} };
    box.appendChild(ed);
  });
}

/* ---------- 이미지 업로드 ----------
   폰(설치형 앱)에서는 화면에 붙어 있지 않은 파일 선택창이 열리지 않거나
   선택 결과가 돌아오지 않는 경우가 있어, input 을 실제로 문서에 붙였다가 지운다. */
function openFilePicker(accept, onFile){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept;
  inp.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(inp);
  const cleanup = ()=> setTimeout(()=>{ if(inp.parentNode) inp.parentNode.removeChild(inp); }, 1500);
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    cleanup();
    if(f) onFile(f);
  };
  inp.click();
}
/* 사진 파일을 그릴 수 있는 형태로 푼다.
   아이폰/갤럭시의 HEIC 같은 형식은 브라우저가 못 여는 경우가 있어 따로 안내한다. */
function decodeImage(file){
  return new Promise((res, rej)=>{
    const byTag = ()=>{
      const reader = new FileReader();
      reader.onerror = ()=> rej(new Error('파일을 읽지 못했습니다'));
      reader.onload = ()=>{
        const img = new Image();
        img.onload  = ()=> res(img);
        img.onerror = ()=> rej(new Error('이 사진 형식은 열 수 없습니다. JPG/PNG로 저장해 다시 시도하세요'));
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    };
    if(self.createImageBitmap){
      createImageBitmap(file).then(res).catch(byTag);
    } else byTag();
  });
}
function pickImage(size, cb, keepPng){
  openFilePicker('image/*', file=>{
    decodeImage(file).then(src=>{
      let w = src.width, h = src.height;
      if(w>h){ if(w>size){ h=Math.round(h*size/w); w=size; } }
      else    { if(h>size){ w=Math.round(w*size/h); h=size; } }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(src,0,0,w,h);
      if(src.close) src.close();
      cb(keepPng ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg',0.82));
    }).catch(err=> toast((err && err.message) || '사진을 불러오지 못했습니다'));
  });
}

/* ---------- 로고 업로드(바깥 여백 자동 잘라내기) ---------- */
function pickLogoImage(cb){
  openFilePicker('image/*', file=>{
    decodeImage(file).then(src=> trimLogo(src, cb))
      .catch(err=> toast((err && err.message) || '사진을 불러오지 못했습니다'));
  });
}
function trimLogo(img, cb){
  {
      const W=img.width, H=img.height;
      const src=document.createElement('canvas'); src.width=W; src.height=H;
      src.getContext('2d').drawImage(img,0,0);
      let x0=0,y0=0,x1=W-1,y1=H-1;
      try{
        const d=src.getContext('2d').getImageData(0,0,W,H).data;
        /* 잘라낼 여백 판정을 두 번 시도한다.
           1) 흰 배경 + 투명 을 여백으로 본다 (보통의 검은 로고)
           2) 1번으로 거의 다 잘려나가면(= 흰 글자 로고) 투명만 여백으로 본다 */
        const box=(ink)=>{
          const rowHas=y=>{ for(let x=0;x<W;x++) if(ink(x,y)) return true; return false; };
          const colHas=x=>{ for(let y=0;y<H;y++) if(ink(x,y)) return true; return false; };
          let a=0,b=0,c=W-1,e=H-1;
          while(b<H-1 && !rowHas(b)) b++;
          while(e>b   && !rowHas(e)) e--;
          while(a<W-1 && !colHas(a)) a++;
          while(c>a   && !colHas(c)) c--;
          return {x0:a, y0:b, x1:c, y1:e, w:c-a+1, h:e-b+1};
        };
        const opaque = (x,y)=> d[(y*W+x)*4+3] >= 20;
        const dark   = (x,y)=>{ const i=(y*W+x)*4;
          if(d[i+3]<20) return false;
          return !(d[i]>235 && d[i+1]>235 && d[i+2]>235); };
        let r = box(dark);
        if(r.w < 4 || r.h < 4) r = box(opaque);        /* 흰 글자 로고 구제 */
        if(r.w < 4 || r.h < 4) r = {x0:0,y0:0,x1:W-1,y1:H-1};   /* 그래도 이상하면 통째로 */
        x0=r.x0; y0=r.y0; x1=r.x1; y1=r.y1;
      }catch(err){ x0=0; y0=0; x1=W-1; y1=H-1; }
      let cw=Math.max(1,x1-x0+1), ch=Math.max(1,y1-y0+1);
      const target=120;                                      // 고해상도 대비 높이
      const sc=Math.min(1, target/ch), ow=Math.round(cw*sc), oh=Math.round(ch*sc);
      const out=document.createElement('canvas'); out.width=ow; out.height=oh;
      out.getContext('2d').drawImage(src, x0,y0,cw,ch, 0,0,ow,oh);
      if(img.close) img.close();
      cb(out.toDataURL('image/png'));
  }
}

/* =========================================================================
   백업 / 복원 / 배포용 파일 만들기
   ========================================================================= */
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function newVersion(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

/* ----- 사진 개수 세기 (데이터 안에 실제로 들어있는 사진) ----- */
function countImages(d){
  let n = 0;
  const isPic = v => typeof v === 'string' && v.indexOf('data:image') === 0;
  if(!d) return 0;
  if(isPic(d.logo)) n++;                       /* 전역 로고 */
  const lists = d.groups ? Object.keys(d.groups).map(k=>d.groups[k])
              : (Array.isArray(d.lists) ? d.lists : [d]);
  lists.forEach(Lst=>{
    if(Lst !== d && isPic(Lst.logo)) n++;      /* 예전 형식(리스트별 로고) */
    (Lst.users||[]).forEach(u=>{
      if(isPic(u.avatar)) n++;
      (u.stories||[]).forEach(s=>{ if(isPic(s.image)) n++; });
      if(isPic(u.storyImage)) n++;                      /* 예전 형식 */
    });
    (Lst.posts||[]).forEach(p=> (p.images||[]).forEach(s=>{ if(isPic(s)) n++; }));
    (Lst.dms||[]).forEach(dm=> (dm.messages||[]).forEach(m=>{ if(isPic(m.image)) n++; }));
  });
  return n;
}
/* 만들어진 파일에서 데이터 구간을 다시 읽어 확인한다 */
function readBuilt(html){
  try{
    const i = html.indexOf(MARK_S), j = html.indexOf(MARK_E);
    if(i < 0 || j <= i) return null;
    const block = html.slice(i, j).replace(MARK_S, '/*');
    return (new Function(block + '\nreturn { v: DATA_VERSION, d: EMBEDDED_DATA };'))();
  }catch(e){ return null; }
}

/* ----- JSON 백업 ----- */
function exportData(){
  const payload = { app:'단서인스타', version:DATA_VERSION, exportedAt:new Date().toISOString(), data:data };
  downloadFile('단서인스타_백업.json', JSON.stringify(payload,null,2), 'application/json');
  toast('백업 파일을 저장했습니다');
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const body = (parsed && parsed.data) ? parsed.data : parsed;
      /* 새 형식(지점›테마) · 예전 형식(리스트) · 아주 예전 형식(users 만) 모두 받아들인다 */
      const ok = body && typeof body === 'object' &&
        (Array.isArray(body.tree) || body.groups || Array.isArray(body.lists) || Array.isArray(body.users));
      if(!ok) throw new Error('bad');
      /* 불러오기도 되돌릴 수 있게 지금 내용을 보관해 둔다 */
      try{
        const cur = (await idbGetRes(IDB_KEY)).value || lsBox();
        if(cur && cur.data){ restorePoint = cur; await idbSetKey(IDB_PREV, cur); }
      }catch(e){}
      data = normalize(deepCopy(body));
      if(!baseFp) baseFp = fingerprint(normalize(deepCopy(EMBEDDED_DATA)));
      fixView();
      save();                 /* 현재 파일 버전으로 도장을 다시 찍어 저장 */
      applyLogo(); applyBottomPad(); renderFeed();
      toast(`불러왔습니다 · 사진 ${countImages(data)}개`);
      renderAdmin();
    }catch(err){ toast('올바른 백업 파일이 아닙니다'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ----- 지금 내용을 담은 배포용 index.html 만들기 ----- */
const MARK_S = '/*__CS' + '_DATA_START__';
const MARK_E = '/*__CS' + '_DATA_END__*/';

/* 서버 없이(파일을 직접 열었을 때도) 자기 자신의 소스를 만들어 낸다.
   화면에 그려둔 내용은 열 때마다 다시 그리므로 비워서 내보낸다. */
function selfHtml(){
  const root = document.documentElement.cloneNode(true);
  ['#feedScroll','#postScroll','#profileScroll','#dmListScroll','#dmThreadScroll','#pickScroll',
   '#tabbarFeed','#tabbarProfile','#tabbarDM','#storyBars','#storyAv',
   '#storyName','#dmThreadAv','#dmThreadName','#profHeadName'].forEach(sel=>{
    const el = root.querySelector(sel); if(el) el.innerHTML = '';
  });
  /* 관리자 3단(테마·목록·편집) 칸은 화면에 미리 있어야 하는 뼈대다.
     예전처럼 통째로 비우면 만들어진 파일에서 관리자 화면이 열리지 않는다. */
  const ab = root.querySelector('#adminBody');
  if(ab){ ab.setAttribute('data-pane','tree'); ab.innerHTML = ADMIN_PANES_HTML; }
  const st = root.querySelector('#storyTime'); if(st) st.textContent = '';
  const lg = root.querySelector('#feedLogo'); if(lg) lg.innerHTML = '<span class="logo-text">Instagram</span>';
  root.querySelectorAll('#storyBody img').forEach(n=> n.remove());
  root.querySelectorAll('.screen').forEach(s=> s.classList.remove('active'));
  const feed = root.querySelector('#feedScreen'); if(feed) feed.classList.add('active');
  const ov = root.querySelector('#adminOverlay'); if(ov) ov.classList.remove('active');
  const mp = root.querySelector('#modePill'); if(mp) mp.classList.remove('show');
  const cb = root.querySelector('#confirmBox'); if(cb) cb.classList.remove('show');
  const ts = root.querySelector('#toast'); if(ts){ ts.classList.remove('show'); ts.textContent=''; }
  const ph = root.querySelector('#phone'); if(ph) ph.style.removeProperty('--safe-b');
  return '<!DOCTYPE html>\n' + root.outerHTML + '\n';
}
function buildHtmlFrom(tpl){
  const i = tpl.indexOf(MARK_S), j = tpl.indexOf(MARK_E);
  if(i < 0 || j <= i) return null;
  const ver = newVersion();
  const json = JSON.stringify(data, null, 1).replace(/<\//g, '<\\/');
  const block = MARK_S + ' 아래 두 줄이 이 파일에 들어있는 내용입니다. */\n'
    + 'const DATA_VERSION = ' + JSON.stringify(ver) + ';\n'
    + 'const EMBEDDED_DATA = ' + json + ';\n';
  return { html: tpl.slice(0,i) + block + tpl.slice(j), version: ver };
}
function finishExportHtml(built){
  if(!built){ toast('파일을 만들 수 없습니다'); return; }
  /* 만든 파일을 다시 읽어, 사진이 실제로 들어갔는지 확인한 뒤에 내려준다 */
  const want = countImages(data);
  const back = readBuilt(built.html);
  const got  = back ? countImages(back.d) : -1;
  if(got !== want){
    confirmDialog(
      `사진이 파일에 제대로 들어가지 않았습니다.\n지금 내용 ${want}장 / 만들어진 파일 ${got<0?'읽기 실패':got+'장'}\n\n그래도 파일을 저장할까요?`,
      ()=> doSaveBuilt(built, got));
    return;
  }
  doSaveBuilt(built, got);
}
function doSaveBuilt(built, pics){
  downloadFile('index.html', built.html, 'text/html;charset=utf-8');
  baseFp = fingerprint(data);
  save();
  const mb = Math.round(built.html.length/1024/102.4)/10;
  toast(`새 index.html 저장됨 · 사진 ${pics<0?'?':pics}장 · ${mb}MB`);
  if($('#adminOverlay').classList.contains('active')) renderAdmin();
}
function exportHtml(){
  if(location.protocol.indexOf('http') !== 0){
    /* 파일로 직접 열었을 때는 “지금 열려 있는 화면의 코드”가 그대로 저장된다.
       기능이 추가된 파일을 새로 받은 뒤 새로고침 없이 내보내면 예전 코드로 되돌아가므로 한 번 확인한다. */
    confirmDialog('지금 화면에 열려 있는 상태로 파일을 만듭니다.\n기능이 바뀐 파일을 새로 받았다면 먼저 새로고침 후에 만들어 주세요.',
      ()=> finishExportHtml(buildHtmlFrom(selfHtml())));
    return;
  }
  fetch('./index.html?_ex=' + Date.now(), {cache:'no-store'})
    .then(r=> r.ok ? r.text() : Promise.reject())
    .then(tpl=> finishExportHtml(buildHtmlFrom(tpl)))
    .catch(()=> finishExportHtml(buildHtmlFrom(selfHtml())));
}

/* ---------- 초기화 / 설치(PWA) ----------
   주소 끝에 ?reset=1 을 붙여 열면 저장된 내용과 캐시를 전부 지우고 처음 상태로 시작합니다.
   같은 주소(github.io 등)에 다른 단서 앱이 함께 올라가 있을 수 있으므로
   이 앱의 캐시·서비스워커만 골라서 지웁니다. */
const CACHE_PREFIX = 'crimescene-insta-';
function appDir(){ try{ return new URL('./', location.href).href; }catch(e){ return location.href; } }
const wantReset = /[?&]reset=1/.test(location.search);
if(wantReset){
  try{
    if(window.caches && caches.keys)
      caches.keys().then(ks=> ks.forEach(k=>{ if(k.indexOf(CACHE_PREFIX)===0) caches.delete(k); }));
  }catch(e){}
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      const dir = appDir();
      navigator.serviceWorker.getRegistrations().then(rs=> rs.forEach(r=>{
        if(String(r.scope).indexOf(dir)===0) r.unregister();
      }));
    }
  }catch(e){}
}

  try{ console.error('[단서 인스타] ' + where + ' 실패', e); }catch(x){}
}
setTimeout(function(){ if(!data && !bootFailed) showBootError('load', {message:'저장된 내용을 읽는 중 응답이 없습니다'}); }, 6000);

/* 초기 렌더 (저장소가 IndexedDB 라 읽기가 비동기다) */
(async function boot(){
  try{
  if(wantReset){
    /* 초기화도 흔적을 남긴다 — 실수로 눌러도 되돌릴 수 있게 */
    try{ const old = (await idbGet()) || lsBox(); if(old && old.data) await idbSetKey(IDB_PREV, old); }catch(e){}
    await wipeStored();
    await clearView();                    /* 고른 계정·모드도 처음 상태로 */
  }
  await askPersist();                     /* 저장 공간을 브라우저가 지우지 못하게 요청 */
  loadView();
  loadBranch();
  await loadViewBackup();                 /* localStorage 가 비었으면 IndexedDB 사본으로 복구 */
  data = await load();
  fixView();
  /* 되돌릴 수 있는 직전 내용이 보관돼 있으면 관리자 화면에 표시한다 */
  if(!restorePoint){ try{ restorePoint = await idbGetKey(IDB_PREV); }catch(e){} }
  if(!autoPoint){ try{ autoPoint = await idbGetKey(IDB_AUTO); }catch(e){} }
  /* 저장이 안 되는 상황이면 조용히 넘어가지 않고 바로 알린다 */
  if(saveBlocked) setTimeout(()=> toast('저장된 내용을 읽지 못했습니다. 내용 보호를 위해 저장을 멈췄습니다 — 앱을 껐다 켜 주세요.'), 600);
  else if(idbState === 'unavailable') setTimeout(()=> toast('파일을 직접 열어 실행 중입니다. 사진이 저장되지 않을 수 있습니다.'), 600);
  /* 주소에 ?theme=테마이름 (또는 예전 ?list=) 이 있으면 그 테마로 연다 */
  try{
    const q = new URL(location.href).searchParams;
    const k = q.get('theme') || q.get('list');
    if(k){
      let th=null;
      (data.tree||[]).forEach(c1=> (c1.children||[]).forEach(c2=>{ if(!th && (c2.name===k || c2.id===k)) th=c2; }));
      if(th && th.gid !== curGid){ curGid = th.gid; viewAsId=''; viewUserName=''; saveView(); fixView(); }
    }
  }catch(e){}
  applyLogo(); applyBottomPad();

  /* 첫 화면
     - PC(넓은 화면) : 계정 고르기 없이 관리자 편집 화면으로 시작.
                       단, 그 PC 에서 “손님 모드”를 눌러 둔 적이 있으면 손님 화면으로 연다.
     - 폰            : 마지막으로 보던 계정 그대로. 고른 적이 없으면 계정 고르기.
                       끄기 전 관리자 모드였다면 관리자 모드로 열린다. */
  /* 갓 설치한 폰은 먼저 “이 폰을 쓸 지점”부터 고르게 한다 (다른 지점 스포일러 방지) */
  if(!bigScreen() && !lockedC1() && (data.tree||[]).length){
    renderFeed();
    renderBranchPicker();
    if(('serviceWorker' in navigator) && location.protocol.indexOf('http')===0){
      navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(DATA_VERSION), {updateViaCache:'none'}).catch(()=>{});
    }
    return;
  }
  fixThemeForBranch();

  /* 이 기기에서 아직 계정을 고른 적이 없으면(= 갓 설치한 폰) 관리자 화면부터 연다 */
  const freshDevice = !viewAsUser();
  const pcStart  = bigScreen() && startMode !== 'guest';
  const openAsAdmin = (startMode === 'admin') || pcStart || freshDevice;
  navHome();            /* 게시물·스토리가 없는 폰이면 바로 DM 화면으로 열린다 */
  if(openAsAdmin){
    if(freshDevice){
      /* 갓 설치한 기기 — 지점(잠겼으면 그 지점)부터 고르게 한다 */
      const lk0 = branchLocked() ? lockedC1() : null;
      treePath = lk0 ? [lk0.id] : []; adminView = 'tree'; adminTab = 'users'; adminEdit = null; adminPane = 'tree';
    } else {
      /* 지금 테마를 펼친 상태(계정·게시물 목록)로 연다 */
      let c1=null, c2=null;
      (data.tree||[]).forEach(a=> (a.children||[]).forEach(b=>{ if(!c2 && b.gid===curGid){ c1=a; c2=b; } }));
      if(c1 && c2){ treePath=[c1.id]; adminView='list'; adminTab='users'; adminEdit=null; }
    }
    openAdmin();
  }

  /* 서비스워커: 최신 파일 우선 + 예전 캐시 자동 삭제 (http/https 로 열었을 때만) */
  if(('serviceWorker' in navigator) && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(DATA_VERSION), {updateViaCache:'none'})
      .catch(()=>{});
  }
  }catch(e){ showBootError('boot', e); }
})();
</script>
