<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Instagram">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="./icons/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Instagram</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overscroll-behavior:none; }
  body {
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#000; display:flex; justify-content:center; align-items:center; overflow:hidden;
    overscroll-behavior:none;
  }
  #phone { --safe-b:0px; width:100%; max-width:430px; height:100vh; height:100dvh; max-height:930px; background:#fff;
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.4); }

  /* 화면 전환 */
  .screen { flex:1; display:none; flex-direction:column; overflow:hidden; }
  .screen.active { display:flex; }
  .scroll { flex:1; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }

  /* ── 공통 헤더 ── */
  .ig-head { flex-shrink:0; height:50px; display:flex; align-items:center; padding:0 12px;
    border-bottom:1px solid #efefef; gap:8px; }
  .logo { font-family:"Billabong","Snell Roundhand","Segoe Script","Apple Chancery",cursive;
    font-size:30px; line-height:1; font-weight:500; color:#262626; letter-spacing:.2px;
    padding-bottom:4px; }
  .ig-head .hicon { width:26px; height:26px; color:#262626; }

  /* ── 홈 헤더 (좌:＋ / 중앙:로고 / 우:노트·하트) ── */
  .feed-head { position:relative; justify-content:space-between; padding:0 10px; }
  .feed-head .logo { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    user-select:none; -webkit-user-select:none; cursor:default; display:flex; align-items:center; }
  .feed-head .logo img { height:30px; width:auto; max-width:210px; object-fit:contain; display:block; }
  .hbtn { position:relative; background:none; border:none; padding:0; width:36px; height:36px;
    display:flex; align-items:center; justify-content:center; color:#262626; cursor:pointer; }
  .hbtn svg { width:26px; height:26px; display:block; }
  .head-right { display:flex; align-items:center; gap:2px; margin-left:auto; z-index:1; }
  .feed-head #btnPlus { z-index:1; }
  .badge-dot { position:absolute; top:4px; right:4px; width:9px; height:9px; border-radius:50%;
    background:#ff3040; border:1.5px solid #fff; }
  .ig-head .back { width:30px; font-size:26px; color:#262626; background:none; border:none; cursor:pointer; }
  .ig-head .htitle { flex:1; font-size:16px; font-weight:600; color:#262626; }
  .ig-head .htitle small { display:block; font-size:11px; color:#8e8e8e; font-weight:400; }

  /* ── 스토리 ── */
  .stories { display:flex; gap:14px; padding:12px 14px; overflow-x:auto; border-bottom:1px solid #efefef; }
  .stories::-webkit-scrollbar{ display:none; }
  .story { flex-shrink:0; width:64px; text-align:center; cursor:pointer; }
  .story-ring { width:62px; height:62px; border-radius:50%; padding:2.5px;
    background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
  .story-ring.seen { background:#dbdbdb; }
  .story-ring > div { width:100%; height:100%; border-radius:50%; overflow:hidden; border:2px solid #fff;
    background:#efefef; }
  .story-ring img { width:100%; height:100%; object-fit:cover; }
  .story-name { font-size:11px; color:#262626; margin-top:4px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .story.mine { position:relative; }
  /* 내 계정도 스토리가 있으면 컬러 링, 없을 때만 회색 (.seen) */
  .story .add-badge { position:absolute; left:42px; top:40px; width:22px; height:22px; border-radius:50%;
    background:#0095f6; border:2px solid #fff; color:#fff; display:flex; align-items:center;
    justify-content:center; font-size:15px; line-height:1; font-weight:600; }

  /* ── 게시물 카드 ── */
  .post { border-bottom:1px solid #efefef; }
  .post-head { display:flex; align-items:center; padding:9px 12px; gap:9px; }
  .av { border-radius:50%; overflow:hidden; flex-shrink:0; background:#efefef; }
  .av img { width:100%; height:100%; object-fit:cover; }
  .av.ring { padding:2px; background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
  .av.ring.seen { background:#dbdbdb; }
  .av.ring > div { width:100%; height:100%; border-radius:50%; overflow:hidden; border:2px solid #fff; background:#efefef; }
  .post-user { flex:1; min-width:0; display:flex; align-items:center; gap:4px; }
  .uname { font-size:13.5px; font-weight:600; color:#262626; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .verified { width:13px; height:13px; flex-shrink:0; }
  .post-menu { font-size:20px; color:#262626; padding:0 4px; }
  /* 게시물 사진 (여러 장 좌우 넘기기) */
  .post-media { position:relative; width:100%; }
  .post-track { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;
    -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; cursor:pointer; }
  .post-track::-webkit-scrollbar { display:none; }
  /* scroll-snap-stop:always → 세게 밀어도 한 장씩만 넘어간다 */
  .post-slide { flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always;
    aspect-ratio:3/4; background:#efefef; }
  .post-slide img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;
    -webkit-user-drag:none; user-select:none; }
  .post-slide.empty { display:flex; align-items:center; justify-content:center; color:#adb5bd; font-size:13px; }
  .post-count { position:absolute; top:12px; right:12px; background:rgba(0,0,0,.6); color:#fff;
    font-size:12px; font-weight:600; padding:3px 10px; border-radius:12px; pointer-events:none; }
  .post-dots { display:flex; justify-content:center; gap:4px; padding:9px 0 1px; }
  .post-dots i { width:6px; height:6px; border-radius:50%; background:#c7c7c7; transition:background .15s; }
  .post-dots i.on { background:#0095f6; }
  .post-actions { display:flex; align-items:center; padding:8px 12px 4px; gap:15px; }
  .post-actions .ico { width:25px; height:25px; color:#262626; cursor:pointer; }
  .post-actions .ico.liked { color:#ed4956; }
  .post-actions .spacer { flex:1; }
  .post-likes { padding:2px 12px; font-size:13.5px; font-weight:600; color:#262626; }
  .post-caption { padding:3px 12px; font-size:13.5px; color:#262626; line-height:1.4; }
  .post-caption b { font-weight:600; }
  .post-comments-link { padding:3px 12px; font-size:13.5px; color:#8e8e8e; }
  .post-time { padding:3px 12px 12px; font-size:10.5px; color:#8e8e8e; text-transform:uppercase; letter-spacing:.3px; }

  /* ── 게시물 상세 댓글 ── */
  .comment { display:flex; gap:10px; padding:7px 14px; align-items:flex-start; }
  .comment .cbody { flex:1; font-size:13.5px; color:#262626; line-height:1.45; }
  .comment .cbody b { font-weight:600; }
  .comment .cmeta { font-size:11px; color:#8e8e8e; margin-top:3px; }
  .comment .clike { font-size:16px; color:#8e8e8e; padding-top:2px; }
  .detail-caption { display:flex; gap:10px; padding:12px 14px; align-items:flex-start; border-bottom:1px solid #efefef; }

  /* ── 프로필 ── */
  .prof-top { display:flex; align-items:center; padding:16px 16px 8px; gap:22px; }
  .prof-av { width:82px; height:82px; border-radius:50%; overflow:hidden; flex-shrink:0; background:#efefef; }
  .prof-av img { width:100%; height:100%; object-fit:cover; }
  .prof-stats { flex:1; display:flex; justify-content:space-around; text-align:center; }
  .prof-stats .num { font-size:17px; font-weight:700; color:#262626; }
  .prof-stats .lbl { font-size:13px; color:#262626; }
  .prof-name { padding:2px 16px; font-size:13.5px; font-weight:600; color:#262626; }
  .prof-bio { padding:2px 16px 12px; font-size:13.5px; color:#262626; line-height:1.45; white-space:pre-wrap; }
  .prof-btns { display:flex; gap:6px; padding:4px 16px 14px; }
  .prof-btns button { flex:1; height:32px; border-radius:8px; border:none; font-size:13.5px; font-weight:600;
    cursor:pointer; }
  .btn-follow { background:#0095f6; color:#fff; }
  .btn-gray { background:#efefef; color:#262626; }
  .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px; }
  .grid-item { aspect-ratio:3/4; background:#efefef; overflow:hidden; cursor:pointer; position:relative; }
  .grid-item img { width:100%; height:100%; object-fit:cover; display:block; }
  .grid-multi { position:absolute; top:5px; right:6px; color:#fff; font-size:15px; line-height:1;
    text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .grid-text { width:100%; height:100%; padding:9px 8px; font-size:11.5px; line-height:1.45;
    color:#262626; background:#fafafa; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7;
    -webkit-box-orient:vertical; word-break:break-word; }
  .grid-tabs { display:flex; border-top:1px solid #efefef; }
  .grid-tabs > div { flex:1; display:flex; justify-content:center; padding:10px 0; color:#262626; }
  .grid-tabs > div.off { color:#c7c7c7; }
  .grid-tabs svg { width:24px; height:24px; }

  /* ── DM 목록 ── */
  .dmlist-head { flex-shrink:0; position:relative; height:52px; display:flex; align-items:center;
    justify-content:center; padding:0 12px; }
  .dmlist-title { display:flex; align-items:center; gap:6px; font-size:17px; font-weight:700; color:#262626; }
  .dmlist-title .chev { width:16px; height:16px; }
  .dmlist-title .reddot { width:8px; height:8px; border-radius:50%; background:#ff3040; display:inline-block; }
  .dmlist-compose { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#262626;
    display:flex; }
  .dmlist-compose svg { width:26px; height:26px; }
  .dm-searchwrap { flex-shrink:0; padding:4px 14px 10px; }
  .dm-search { height:40px; border-radius:12px; background:#efefef; display:flex; align-items:center;
    gap:10px; padding:0 14px; }
  .dm-search svg { width:18px; height:18px; flex-shrink:0; }
  .dm-search span { font-size:15px; color:#8e8e8e; }
  .dm-sectionhead { flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:2px 16px 8px; }
  .dm-sectionhead b { font-size:15px; color:#262626; }
  .dm-sectionhead span { font-size:14px; color:#0095f6; font-weight:600; }

  .dm-item { display:flex; align-items:center; padding:8px 16px; gap:13px; cursor:pointer; }
  .dm-meta { flex:1; min-width:0; }
  .dm-name { font-size:15px; font-weight:600; color:#262626; }
  .dm-last { font-size:14px; color:#8e8e8e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }

  /* ── DM 대화 ── */
  .dmthread-head { flex-shrink:0; height:58px; display:flex; align-items:center; gap:10px; padding:0 12px;
    background:#fff; }
  .dmt-back { background:none; border:none; padding:0; width:28px; height:28px; color:#262626; cursor:pointer;
    display:flex; align-items:center; }
  .dmt-back svg { width:26px; height:26px; }
  .dmt-name { flex:1; min-width:0; font-size:16px; font-weight:700; color:#262626; display:flex;
    align-items:center; gap:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dmt-name .after { font-weight:500; color:#262626; }
  .dmt-ico { color:#262626; display:flex; flex-shrink:0; }
  .dmt-ico svg { width:26px; height:26px; }
  .dm-thread { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:3px;
    overscroll-behavior:contain; }
  .dm-row { display:flex; margin-bottom:2px; align-items:flex-end; gap:8px; max-width:100%; }
  .dm-row.mine { flex-direction:row-reverse; }
  .dm-bubble { max-width:70%; padding:9px 13px; border-radius:20px; font-size:14px; line-height:1.35;
    word-break:break-word; white-space:pre-wrap; }
  .dm-row:not(.mine) .dm-bubble { background:#efefef; color:#262626; }
  .dm-row.mine .dm-bubble { background:linear-gradient(135deg,#4f5bd5,#962fbf,#d62976); color:#fff; }
  .dm-row .dm-av { width:26px; height:26px; border-radius:50%; overflow:hidden; flex-shrink:0; background:#efefef; }
  .dm-row .dm-av img{ width:100%; height:100%; object-fit:cover; }
  .dm-img { max-width:62%; border-radius:18px; overflow:hidden; }
  .dm-img img { width:100%; display:block; }
  /* 사진 옆 공유(비행기) 아이콘 */
  .dm-share { width:34px; height:34px; border-radius:50%; background:#efefef; display:flex;
    align-items:center; justify-content:center; flex-shrink:0; align-self:center; }
  .dm-share svg { width:18px; height:18px; color:#262626; }
  /* 가운데 날짜·시간 구분선 */
  .dm-stamp { text-align:center; font-size:12.5px; color:#8e8e8e; padding:14px 10px 10px; }
  /* 단톡 : 보낸 사람 이름, 겹친 프로필 사진 */
  .dm-sender { font-size:11.5px; color:#8e8e8e; margin:8px 0 3px 34px; }
  .av-stack { position:relative; flex-shrink:0; }
  .av-stack > div { position:absolute; border-radius:50%; overflow:hidden; border:2px solid #fff; background:#efefef; }
  .av-stack img { width:100%; height:100%; object-fit:cover; }

  .dm-inputbar { flex-shrink:0; display:flex; align-items:center; gap:9px;
    padding:8px 12px calc(10px + env(safe-area-inset-bottom, 0px) + var(--safe-b)); background:#fff; }
  .dm-cam { width:40px; height:40px; border-radius:50%; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; background:#3797f0; }
  .dm-cam svg { width:23px; height:23px; }
  .dm-field { flex:1; min-width:0; height:44px; border-radius:22px; background:#f1f2f4; display:flex;
    align-items:center; gap:12px; padding:0 14px; }
  .dm-field .ph { flex:1; min-width:0; color:#8e8e8e; font-size:15px; white-space:nowrap; overflow:hidden; }
  .dm-fico { color:#262626; display:flex; flex-shrink:0; }
  .dm-fico svg { width:23px; height:23px; }

  /* ── 하단 탭바 ── */
  .tabbar { flex-shrink:0; display:flex; align-items:stretch; border-top:1px solid #efefef;
    padding-bottom:calc(env(safe-area-inset-bottom, 0px) + var(--safe-b)); background:#fff; }
  .tab { flex:1; display:flex; align-items:center; justify-content:center; min-height:50px; color:#262626;
    cursor:pointer; position:relative; }
  .tab svg { width:26px; height:26px; }
  .tab .tav { width:26px; height:26px; border-radius:50%; overflow:hidden; border:1px solid #262626; }
  .tab .tav img { width:100%; height:100%; object-fit:cover; }
  .tab .tab-dot { position:absolute; bottom:11px; right:calc(50% - 17px); width:9px; height:9px;
    border-radius:50%; background:#ff3040; border:1.5px solid #fff; }

  .empty { padding:50px 30px; text-align:center; color:#8e8e8e; font-size:14px; line-height:1.7; }

  /* ── 이 폰을 쓸 지점 고르기 (고르기 전에는 내용이 전혀 보이지 않는다) ── */
  #pickBranch { position:absolute; inset:0; z-index:70; display:none; padding:22px;
                align-items:center; justify-content:center;
                background:linear-gradient(140deg,#feda75,#d62976 55%,#4f5bd5); }
  #pickBranch.show { display:flex; }
  .bp-card { width:100%; max-width:360px; max-height:100%; overflow:auto; background:#fff;
             border-radius:18px; padding:22px 18px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .bp-title { font-size:17px; font-weight:800; text-align:center; color:#262626; }
  .bp-sub { font-size:12.5px; color:#8e8e8e; text-align:center; margin:6px 0 16px; line-height:1.55; }
  .bp-row { display:flex; align-items:center; gap:10px; padding:13px 12px; border-radius:12px;
            cursor:pointer; border:1px solid #efefef; margin-bottom:8px; }
  .bp-row:active { background:#fafafa; }
  .bp-name { font-size:15.5px; font-weight:700; flex:1; min-width:0; color:#262626; }
  .bp-cnt { font-size:12px; color:#8e8e8e; font-weight:400; }
  .bp-go { font-size:12.5px; color:#0095f6; font-weight:700; white-space:nowrap; }
  .bp-foot { font-size:11px; color:#b9b9b9; text-align:center; margin-top:12px; line-height:1.5; }

  /* ── 계정 고르기 ── */
  .pick-head { flex-shrink:0; padding:30px 24px 16px; text-align:center; }
  .pick-logo { display:flex; justify-content:center; margin-bottom:22px; }
  .pick-logo img { height:30px; width:auto; max-width:210px; object-fit:contain; }
  .pick-logo .logo-text { font-family:"Billabong","Snell Roundhand","Segoe Script",cursive;
    font-size:30px; color:#262626; }
  .pick-title { font-size:17px; font-weight:700; color:#262626; }
  .pick-sub { font-size:13px; color:#8e8e8e; margin-top:6px; line-height:1.5; }
  .pick-item { display:flex; align-items:center; gap:14px; padding:12px 22px; cursor:pointer; }
  .pick-item:active { background:#fafafa; }
  .pick-item .pav { width:56px; height:56px; border-radius:50%; overflow:hidden; background:#efefef; flex-shrink:0; }
  .pick-item .pav img { width:100%; height:100%; object-fit:cover; }
  .pick-item .pmeta { flex:1; min-width:0; }
  .pick-item .pname { font-size:15px; font-weight:600; color:#262626; }
  .pick-item .psub { font-size:13px; color:#8e8e8e; margin-top:2px; }
  .pick-item .pgo { color:#0095f6; font-size:13px; font-weight:600; }

  /* ── 관리자 ── */
  #adminOverlay { display:none; position:absolute; inset:0; background:#f4f5f7; z-index:50; flex-direction:column; }
  #adminOverlay.active { display:flex; }
  .admin-header { background:#262626; color:#fff; padding:14px 16px; display:flex; align-items:center;
    justify-content:space-between; flex-shrink:0; }
  .admin-header h2 { font-size:17px; }
  .admin-header .row-actions { display:flex; gap:8px; }
  .admin-header button { background:rgba(255,255,255,.16); color:#fff; border:none; padding:8px 13px;
    border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }
  .admin-body { flex:1; overflow-y:auto; padding:14px; }

  /* 모바일: 한 번에 한 칸만 보여준다 */
  #adminBody[data-pane="tree"] #paneList, #adminBody[data-pane="tree"] #paneEdit,
  #adminBody[data-pane="list"] #paneTree, #adminBody[data-pane="list"] #paneEdit,
  #adminBody[data-pane="edit"] #paneTree, #adminBody[data-pane="edit"] #paneList { display:none; }
  .pane-empty { color:#98a5b2; font-size:13px; text-align:center; padding:44px 16px; line-height:1.7; }

  /* PC(넓은 화면 + 마우스): 테마 목록 · 테마 관리 · 세부편집 3단 */
  @media (min-width:1000px) and (pointer:fine){
    body { background:#e9edf0; }
    #phone { max-width:none; max-height:none; width:100vw; height:100vh; box-shadow:none; background:#e9edf0; }
    /* 손님 화면은 폰 모양 그대로 가운데에 */
    .screen { max-width:430px; width:100%; margin:0 auto; background:#fff;
      box-shadow:0 0 30px rgba(0,0,0,.12); }
    .admin-body { display:flex; gap:14px; align-items:stretch; overflow:hidden; padding:14px; }
    .apane { overflow-y:auto; min-width:0; padding-right:2px; }
    #paneTree { flex:0 0 340px; }
    #paneList { flex:0 0 390px; }
    #paneEdit { flex:1 1 auto; }
    #adminBody[data-pane] #paneTree,
    #adminBody[data-pane] #paneList,
    #adminBody[data-pane] #paneEdit { display:block; }
    .pane-back { display:none; }   /* 3단에서는 칸이 항상 보이므로 뒤로가기 불필요 */
  }
  .admin-tabs { display:flex; gap:6px; margin-bottom:14px; }
  .admin-tabs button { flex:1; padding:10px 4px; border:none; border-radius:9px; background:#e6e8eb;
    color:#3a4a5a; font-weight:700; font-size:13px; cursor:pointer; }
  .admin-tabs button.on { background:#262626; color:#fff; }

const IDB_NAME = 'crimescene_insta', IDB_STORE = 'kv', IDB_KEY = 'box';
const IDB_PREV = 'box_prev';        /* 파일 내용으로 갈아끼우기·불러오기 직전의 저장분 */
const IDB_AUTO = 'box_auto';        /* 자동 백업 (사진 지킴이) — 사고가 나도 여기서 되살린다 */

let idbState = 'ok';
function idbOpen(){
  return new Promise((res, rej)=>{
    if(!self.indexedDB){ idbState = 'unavailable'; return rej(new Error('indexedDB 없음')); }

    if(location.protocol === 'file:'){ idbState = 'unavailable'; return rej(new Error('파일 직접 열기')); }

    const finish = (fn, v)=>{ if(!settled){ settled = true; clearTimeout(timer); fn(v); } };
    const timer = setTimeout(()=>{
      if(!settled){ settled = true; idbState = 'unavailable'; rej(new Error('시간 초과')); }
    }, 2500);
    let rq;
    try{ rq = indexedDB.open(IDB_NAME, 1); }
    catch(e){ idbState = 'unavailable'; return finish(rej, e); }
    rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore(IDB_STORE); }catch(e){} };
    rq.onsuccess = ()=>{ idbState = 'ok'; finish(res, rq.result); };
    rq.onerror   = ()=>{ if(idbState !== 'unavailable') idbState = 'error';

   이것을 섞으면 읽기에 한 번 실패했을 때 파일 내용으로 덮어써서 사진이 사라진다. */
function idbGetRes(k){

    let tx;

    catch(e){ return res({ok:false, value:null}); }
    const rq = tx.objectStore(IDB_STORE).get(k);
    rq.onsuccess = ()=> res({ok:true, value: rq.result || null});
    rq.onerror   = ()=> res({ok:false, value:null});
  })).catch(()=> ({ok:false, value:null}));
}

function idbSetKey(k, v){

    const tx = db.transaction(IDB_STORE, 'readwrite');

    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> rej(tx.error || new Error('저장 실패'));
    tx.onabort    = ()=> rej(tx.error || new Error('저장 중단'));
  }));
}
function idbGet(){ return idbGetKey(IDB_KEY); }
function idbSet(v){ return idbSetKey(IDB_KEY, v); }
function idbDel(){

    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(IDB_KEY);
    tx.oncomplete = ()=> res(true); tx.onerror = ()=> res(false); tx.onabort = ()=> res(false);

function bigScreen(){
  try{
    const w = Math.max(window.innerWidth||0, (document.documentElement||{}).clientWidth||0, 0);
    if(w >= 900) return true;
    if(w > 0) return false;                /* 너비를 읽었는데 좁으면 폰 */
    /* 너비를 못 읽는 드문 경우 : 화면 크기와 마우스 여부로 판단 */
    return (((window.screen||{}).width)||0) >= 1000 || window.matchMedia('(pointer:fine)').matches;
  }catch(e){ return false; }
}
function loadView(){
  try{ viewSaved = applyViewObj(JSON.parse(localStorage.getItem(VIEW_KEY))); }
  catch(e){ curGid=''; viewAsId=''; startMode=''; viewSaved=false; viewThemeName=''; viewUserName=''; }
}
/* localStorage 가 비워졌다면 IndexedDB 에 남은 사본으로 되살린다 */
async function loadViewBackup(){
  if(viewSaved) return;
  try{
    const v = await idbGetKey(IDB_VIEW);
    if(applyViewObj(v)){ viewSaved = true; saveView(); }
  }catch(e){}
}
function saveView(){
  const th = themeOf(curGid), me = (((data||{}).groups||{})[curGid]||{users:[]}).users.find(u=>u.id===viewAsId);
  if(th) viewThemeName = th.name || '';
  if(me) viewUserName = me.username || '';
  const v = {gid:curGid, viewAs:viewAsId, mode: isAdmin?'admin':'guest', theme:viewThemeName, user:viewUserName};
  viewSaved = true;
  try{ localStorage.setItem(VIEW_KEY, JSON.stringify(v)); }catch(e){}
  try{ idbSetKey(IDB_VIEW, v).catch(()=>{}); }catch(e){}
}
function clearView(){
  curGid=''; viewAsId=''; startMode=''; viewSaved=false; viewThemeName=''; viewUserName='';
  try{ localStorage.removeItem(VIEW_KEY); localStorage.removeItem(PAD_KEY); }catch(e){}
  try{ return idbSetKey(IDB_VIEW, null).catch(()=>{}); }catch(e){ return Promise.resolve(); }
}
function allGroupIds(){
  const out=[];
  (((data||{}).tree)||[]).forEach(c1=> (c1.children||[]).forEach(c2=>{ if(c2.gid) out.push(c2.gid); }));
  return out;
}
function themeOf(gid){
  let found=null;
  (((data||{}).tree)||[]).forEach(c1=> (c1.children||[]).forEach(c2=>{ if(c2.gid===gid) found=c2; }));
  return found;
}
/* 지금 보고 있는 인스타그램 한 벌 */
function L(){
  const g = (data.groups||{})[curGid];
  if(g) return g;
  const first = allGroupIds()[0];
  if(first){ curGid = first; return data.groups[first]; }
  return {today:'',users:[],posts:[],dms:[]};
}
function selectGroup(gid){ curGid = gid; viewAsId = ''; viewUserName = ''; saveView(); }
/* 이 기기에서 “내 계정”으로 볼 계정 */
function setViewAs(uid){
  viewAsId = uid; saveView(); applyMainFlags();
}
function applyMainFlags(){
  const us = L().users || [];
  us.forEach(u=> u.isMain = false);
  const me = us.find(u=> u.id === viewAsId);
  if(me) me.isMain = true;
}
function viewAsUser(){ return (L().users||[]).find(u=> u.id === viewAsId) || null; }
/* 이 항목이 지금 고른 계정에게 보이는지 */
function visibleHere(o){
  const only = o && o.only;
  if(!Array.isArray(only) || !only.length) return true;   /* 지정 없으면 모두에게 */
  return only.indexOf(viewAsId) >= 0;
}

/* 구버전 데이터 보정 + 지점›테마 구조로 올려주기 */
function normalize(d){
  d = d || {};
  /* 아주 예전 형식(최상위에 users/posts/dms) → 리스트 하나로 감싸서 아래 절차를 태운다 */
  if(!Array.isArray(d.lists) && (d.users || d.posts || d.dms)){
    d = { tree: d.tree || null, logo: d.logo||'', bottomPad: d.bottomPad||0, groups: d.groups,
      lists: [{ key:'기본', label:'기본', today:'', users:d.users||[], posts:d.posts||[], dms:d.dms||[] }]};
  }
  if(!Array.isArray(d.lists)) d.lists = [];

  if(d.logo === undefined) d.logo = (d.lists.find(x=>x.logo)||{}).logo || '';
  if(d.bottomPad === undefined) d.bottomPad = (d.lists.find(x=>x.bottomPad)||{}).bottomPad || 0;
  d.lists.forEach(x=>{ delete x.logo; delete x.bottomPad; });
  d.lists.forEach(Lst=>{ if(Lst.users || Lst.posts || Lst.dms) normalizeList(Lst); });

  /* 지점 › 테마 트리 */
  if(!Array.isArray(d.tree) || !d.tree.length){
    d.tree = [{id:id(), name:'기본 지점', children:[{id:id(), name:'기본 테마', lists:d.lists.map(x=>x.key)}]}];
  }
  d.tree.forEach(c1=>{
    c1.children = Array.isArray(c1.children) ? c1.children : [];
    c1.children.forEach(c2=>{
      if(Array.isArray(c2.lists)) c2.lists = c2.lists.filter(k=> d.lists.some(x=>x.key===k));
    });
  });
  /* 어느 테마에도 안 들어간 예전 리스트는 “미분류” 테마로 */
  if(d.lists.length){
    const placed = new Set();
    d.tree.forEach(c1=> c1.children.forEach(c2=> (c2.lists||[]).forEach(k=> placed.add(k))));
    const orphans = d.lists.map(x=>x.key).filter(k=> !placed.has(k));
    if(orphans.length){
      let bin = null;
      d.tree.forEach(c1=> c1.children.forEach(c2=>{ if(c2.name==='미분류') bin = c2; }));
      if(!bin){ bin = {id:id(), name:'미분류', lists:[]}; d.tree.push({id:id(), name:'미분류', children:[bin]}); }
      orphans.forEach(k=> bin.lists.push(k));
    }
  }
  buildGroups(d);                       /* 테마마다 인스타그램 한 벌 */
  return d;
}
/* 데이터를 새로 불러온 뒤, 이 기기의 보기 설정을 유효한 값으로 맞춘다 */
function fixView(){
  const gids = allGroupIds();
  if(gids.indexOf(curGid) < 0){
    /* 번호가 안 맞으면 마지막으로 보던 테마 이름으로 찾아본다 */
    let byName = '';
    if(viewThemeName) (((data||{}).tree)||[]).forEach(c1=> (c1.children||[]).forEach(c2=>{
      if(!byName && c2.gid && c2.name === viewThemeName) byName = c2.gid;
    }));
    curGid = byName || gids[0] || '';
  }
  const us = L().users || [];
  if(!us.some(u=> u.id === viewAsId)){
    /* 계정도 마찬가지로 아이디(@) 로 다시 찾는다 — 파일을 새로 만들어도 보던 계정이 유지된다 */
    const same = viewUserName ? us.find(u=> u.username === viewUserName) : null;
    viewAsId = same ? same.id : '';
  }
  applyMainFlags();
  saveView();
}

/* ---------- 중분류별 공용 내용 만들기 ----------
   예전처럼 리스트마다 내용을 들고 있었다면, 같은 중분류의 리스트들을 하나로 합친다.
   모든 리스트에 있던 항목은 공용(only 없음), 일부 리스트에만 있던 항목은 그 리스트에만 보이도록 남긴다. */
function buildGroups(d){
  d.groups = d.groups || {};
  d.tree.forEach(c1=> (c1.children||[]).forEach(c2=>{
    if(!c2.gid) c2.gid = 'g'+id();
    const keys = (c2.lists||[]).filter(k=> d.lists.some(x=>x.key===k));
    const members = keys.map(k=> d.lists.find(x=>x.key===k));

    let g = d.groups[c2.gid];
    const legacy = members.filter(li=> li.users || li.posts || li.dms);
    if(!g){
      g = d.groups[c2.gid] = {today:'', users:[], posts:[], dms:[]};

      /* 계정 : 아이디 기준으로 합친다 */
      legacy.forEach(li=> (li.users||[]).forEach(u=>{
        let t = g.users.find(x=>x.username===u.username);
        if(!t){ t = deepCopy(u); t.stories = t.stories || []; g.users.push(t); }
        else { (u.stories||[]).forEach(s=>{ if(!t.stories.some(x=>x.id===s.id)) t.stories.push(deepCopy(s)); }); }
      }));
      /* 게시물·DM : id 기준. 모든 리스트에 있으면 공용, 일부에만 있으면 그 리스트 전용 */
      const mergeById = (field)=>{
        const seen = {};
        legacy.forEach(li=> (li[field]||[]).forEach(o=>{
          if(!seen[o.id]) seen[o.id] = {item:deepCopy(o), keys:[]};
          seen[o.id].keys.push(li.key);
        }));
        Object.keys(seen).forEach(k=>{
          const rec = seen[k];
          rec.item.only = (rec.keys.length === legacy.length) ? [] : rec.keys.slice();
          g[field].push(rec.item);
        });
      };
      mergeById('posts'); mergeById('dms');
      g.today = (legacy.find(li=>li.today)||{}).today || '';

      /* 합쳐진 계정 기준으로 게시물·댓글·DM 의 계정 참조를 다시 이어준다 */
      const idMap = {};
      legacy.forEach(li=> (li.users||[]).forEach(u=>{
        const t = g.users.find(x=>x.username===u.username);
        if(t) idMap[u.id] = t.id;
      }));
      g.posts.forEach(p=>{
        if(idMap[p.userId]) p.userId = idMap[p.userId];
        (p.comments||[]).forEach(c=>{ if(idMap[c.userId]) c.userId = idMap[c.userId]; });
      });
      g.dms.forEach(dm=>{
        dm.participants = (dm.participants||[]).map(x=> idMap[x] || x);
        (dm.messages||[]).forEach(m=>{ if(idMap[m.fromId]) m.fromId = idMap[m.fromId]; });
      });
      /* 예전엔 리스트(폰)마다 주인이 있었다 → only(보일 폰)를 보일 “계정”으로 바꿔준다.
         ※ 예전 형식을 옮겨올 때만 한다. 이미 계정 id 로 저장된 내용을 여기서 손대면
            “일부 계정에게만 보이기” 설정이 앱을 열 때마다 지워진다. */
      const keyToUser = {};
      members.forEach(li=>{
        const name = li.mainUsername || (((li.users||[]).find(u=>u.isMain) || (li.users||[])[0])||{}).username;
        const u = g.users.find(x=> x.username === name);
        if(u) keyToUser[li.key] = u.id;
      });
      const fixOnly = o=>{
        if(!Array.isArray(o.only) || !o.only.length) return;
        o.only = o.only
          .map(k=> keyToUser[k] || k)                       /* 예전 리스트 키면 계정 id 로 */
          .filter(v=> g.users.some(u=> u.id === v));        /* 실제로 있는 계정만 남긴다 */
      };
      g.posts.forEach(fixOnly);
      g.dms.forEach(fixOnly);
      g.users.forEach(u=> (u.stories||[]).forEach(fixOnly));
    }

    members.forEach(li=>{ delete li.users; delete li.posts; delete li.dms; delete li.today; });
    normalizeGroup(g);
    delete c2.lists;
  }));
  /* 쓰이지 않는 공용 묶음은 버린다 (전역 data 가 아직 없을 수 있어 d 로 계산한다) */
  const used = {};
  (d.tree||[]).forEach(c1=> (c1.children||[]).forEach(c2=>{ if(c2.gid) used[c2.gid]=1; }));
  Object.keys(d.groups).forEach(k=>{ if(!used[k]) delete d.groups[k]; });
  delete d.lists;                       /* 리스트(폰) 개념은 없앴다 */
}
function normalizeGroup(g){
  g.users = g.users || []; g.posts = g.posts || []; g.dms = g.dms || [];
  /* 저장된 내용에 빈(null) 항목이 섞여 있어도 앱이 멈추지 않게 걸러낸다 */
  g.users = g.users.filter(u=> u && typeof u === 'object');
  g.posts = g.posts.filter(p=> p && typeof p === 'object');
  g.dms   = g.dms.filter(m=> m && typeof m === 'object');
  g.users.forEach(u=>{ if(Array.isArray(u.stories)) u.stories = u.stories.filter(s=> s && typeof s === 'object'); });
  g.posts.forEach(p=>{ if(Array.isArray(p.comments)) p.comments = p.comments.filter(c=> c && typeof c === 'object'); });
  g.dms.forEach(m=>{ if(Array.isArray(m.messages)) m.messages = m.messages.filter(x=> x && typeof x === 'object'); });
  if(g.today === undefined) g.today = '';
  g.users.forEach(u=>{
    if(!Array.isArray(u.stories)) u.stories = [];
    if(u.stories.length > MAX_STORIES) u.stories = u.stories.slice(0, MAX_STORIES);
    u.stories.forEach(s=>{
      if(!s.id) s.id = id();
      if(s.isToday===undefined) s.isToday = true;
      if(s.date===undefined) s.date = '';
      if(s.hours===undefined) s.hours = 0;
      if(!Array.isArray(s.only)) s.only = [];
    });
  });
  g.posts.forEach(p=>{
    if(!Array.isArray(p.images)) p.images = [];
    if(!Array.isArray(p.only)) p.only = [];
  });
  g.dms.forEach(dm=>{
    if(!Array.isArray(dm.participants)) dm.participants = [];
    if(!Array.isArray(dm.only)) dm.only = [];
    if(typeof dm.name !== 'string') dm.name = '';       /* 단톡방 이름 (1:1 은 빈칸) */
    if(dm.participants.length <= 2) dm.name = '';
    (dm.messages||[]).forEach(m=>{ if(m.date===undefined) m.date=''; });
  });
}
function normalizeList(Lst){
  Lst.users = Lst.users || []; Lst.posts = Lst.posts || []; Lst.dms = Lst.dms || [];
  if(Lst.today === undefined) Lst.today = '';
  delete Lst.logo; delete Lst.bottomPad;     /* 로고·하단 여백은 전역(data) 으로 옮겼다 */
  if(!Lst.key) Lst.key = '리스트'+Math.random().toString(36).slice(2,6);
  if(!Lst.label) Lst.label = Lst.key;

  /* 계정이 하나도 없는 리스트도 그대로 둔다 (새 리스트를 “계정 없이 시작”으로 만든 경우) */
  let seen=false;
  Lst.users.forEach(u=>{
    if(u.isMain){ if(seen) u.isMain=false; else seen=true; }
    /* 스토리 1개(storyImage/storyTime) → 스토리 여러 개(stories[]) 로 이어받기 */
    if(!Array.isArray(u.stories)){
      u.stories = u.storyImage ? [{id:id(), image:u.storyImage, isToday:true, date:'', hours:parseHours(u.storyTime)}] : [];
    }
    delete u.storyImage; delete u.storyTime;
    if(u.stories.length > MAX_STORIES) u.stories = u.stories.slice(0, MAX_STORIES);
    u.stories.forEach(s=>{
      if(s.isToday===undefined) s.isToday = true;
      if(s.date===undefined) s.date = '';
      if(s.hours===undefined) s.hours = 0;
    });
  });
  if(!seen && Lst.users.length) Lst.users[0].isMain=true;

  Lst.posts.forEach(p=>{
    if(!Array.isArray(p.images)) p.images = p.image ? [p.image] : [];
    delete p.image;
    if(p.images.length > MAX_POST_IMAGES) p.images = p.images.slice(0, MAX_POST_IMAGES);
    /* 예전 자유 입력 time → 오늘/날짜/경과시간 으로 이어받기 */
    if(p.isToday===undefined){ p.isToday = true; p.hours = parseHours(p.time); p.date = ''; }
    if(p.date===undefined) p.date='';
    if(p.hours===undefined) p.hours=0;
    delete p.time;
  });

  const me = Lst.users.find(u=>u.isMain) || Lst.users[0];
  Lst.dms.forEach(dm=>{
    /* 예전 형식({userId, fromMe}) → 참여자 2명 + 보낸사람 id 로 이어받기.
       이렇게 두면 “내 계정”이 바뀔 때 대화 주체가 자동으로 뒤집힌다. */
    if(!Array.isArray(dm.participants)){
      dm.participants = [me ? me.id : '', dm.userId || ''];
      (dm.messages||[]).forEach(m=>{
        if(m.fromId===undefined) m.fromId = m.fromMe ? dm.participants[0] : dm.participants[1];
        delete m.fromMe;
      });
    }
    delete dm.userId;
    (dm.messages||[]).forEach(m=>{ if(m.date===undefined) m.date=''; });
  });
}

/* ---------- 시간 표시 ----------
   관리자는 “3시간 전” 또는 “3” 을 넣는다. 둘 다 3시간으로 읽는다. */
function parseHours(v){
  if(typeof v === 'number') return Math.max(0, Math.round(v));
  const s = String(v||'').trim();
  if(!s) return 0;
  const m = s.match(/(\d+)/);
  return m ? Math.max(0, parseInt(m[1],10)) : 0;
}
/* “오늘”로 볼 기준 날짜 (테마마다 지정, 비어 있으면 실제 오늘) */
function refToday(){
  const s = String(L().today||'').replace(/\D/g,'');
  if(s.length === 8){
    const y=+s.slice(0,4), mo=+s.slice(4,6), d=+s.slice(6,8);
    const dt = new Date(y, mo-1, d);
    if(!isNaN(dt)) return dt;
  }
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function dateFromYmd(v){
  const s = String(v||'').replace(/\D/g,'');
  if(s.length !== 8) return null;
  const y=+s.slice(0,4), mo=+s.slice(4,6), d=+s.slice(6,8);
  const dt = new Date(y, mo-1, d);
  return isNaN(dt) ? null : dt;
}
function fmtYmd(v){
  const dt = dateFromYmd(v);
  if(!dt) return String(v||'');
  return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일`;
}
/* 기준 시점으로부터 몇 시간 전인지 (정렬용 · 작을수록 최신) */
function hoursAgo(item){
  if(item.isToday) return parseHours(item.hours);
  const dt = dateFromYmd(item.date);
  if(!dt) return 1e9;
  const days = Math.round((refToday() - dt)/86400000);
  return Math.max(0, days) * 24;
}
/* 손님 화면에 보여줄 시간 문구
   26시간까지는 “N시간 전”, 그 뒤로 어제 / 2일 전 / 3일 전, 더 지나면 날짜 */
function timeLabel(item){
  if(!item.isToday) return fmtYmd(item.date);
  const h = parseHours(item.hours);
  if(h <= 26) return `${h}시간 전`;
  const d = Math.floor(h/24);
  if(d === 1) return '어제';
  if(d === 2) return '2일 전';
  if(d === 3) return '3일 전';
  const dt = new Date(refToday().getTime() - d*86400000);
  return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일`;
}
/* 최신순 정렬 (손님 화면 전용 · 관리자 목록은 입력 순서 그대로 보여준다) */
function byNewest(arr){ return arr.slice().sort((a,b)=> hoursAgo(a) - hoursAgo(b)); }

/* 스토리 줄 순서 : 내 계정이 항상 첫 칸, 나머지는 최신 스토리 순 */
/* 이 폰에 보이는 스토리만 */
function visibleStories(u){ return (u.stories||[]).filter(s=> s.image && visibleHere(s)); }
function newestStoryHours(u){
  const ss = visibleStories(u);
  if(!ss.length) return 1e9;
  return Math.min(...ss.map(hoursAgo));
}
function storyOrder(){
  const me = mainUser();
  const rest = L().users.filter(u=>u!==me).sort((a,b)=> newestStoryHours(a) - newestStoryHours(b));
  return me ? [me, ...rest] : rest;
}
/* 내 계정을 제외한 계정 (보조용) */
function storyUsers(){ return L().users.filter(u=>!u.isMain); }
/* 스토리가 하나라도 있는 계정만 열람 가능 (내 계정 포함) */
function liveStories(){ return storyOrder().filter(u=> visibleStories(u).length); }

/* ---------- 상단 로고 ----------
   1순위: 파일에 내장된 로고(관리자에서 올린 것 포함)  2순위: 같은 폴더의 logo.png  3순위: 기본 필기체
   내장 이미지를 쓰므로 별도 파일 없이도 어느 기기에서나 똑같이 보인다. */
const LOGO_FILE = './logo.png';
function applyLogo(){
  const box=$('#feedLogo'); if(!box) return;
  box.innerHTML = `<span class="logo-text">Instagram</span>`;
  const src = data.logo || LOGO_FILE;
  const im = new Image();
  im.alt = 'Instagram';
  im.onload = ()=>{ box.innerHTML=''; box.appendChild(im); };
  im.onerror = ()=>{ /* 파일 없음 → 기본 필기체 유지 */ };
  im.src = src;

  if((L().posts||[]).some(visibleHere)) return false;   /* 보이는 게시물이 있으면 피드 */

/* ---------- 하단 여백 ----------
   폰 기종마다 다른 값이라 “이 기기에만” 따로 저장한다.
   기기 값이 없으면 파일에 담긴 기본값을 쓴다. 내용을 업데이트해도 기기 값은 유지된다. */
const PAD_KEY = 'crimescene_insta_pad';
function devicePad(){
  try{ const v = localStorage.getItem(PAD_KEY); return (v === null || v === '') ? null : Math.max(0, Number(v)||0); }
  catch(e){ return null; }
}
function setDevicePad(v){
  try{
    if(v === null) localStorage.removeItem(PAD_KEY);
    else localStorage.setItem(PAD_KEY, String(Math.max(0, Number(v)||0)));
  }catch(e){}
}
function filePad(){ return Math.max(0, Number(data && data.bottomPad)||0); }
function effPad(){ const d = devicePad(); return (d === null) ? filePad() : d; }
function applyBottomPad(){
  document.getElementById('phone').style.setProperty('--safe-b', effPad()+'px');
}

  const cmtHtml = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-11.7 7.7L3 21l1.9-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>`;
  const shareHtml = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>`;
  const saveHtml = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;
  const imgs = (p.images||[]).filter(Boolean);
  const multi = imgs.length > 1;
  const img = imgs.length
    ? `<div class="post-media">
         <div class="post-track">${imgs.map(src=>`<div class="post-slide"><img src="${src}"></div>`).join('')}</div>
         ${multi?`<div class="post-count">1/${imgs.length}</div>`:''}
       </div>
       ${multi?`<div class="post-dots">${imgs.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}`
    : '';   /* 사진이 없으면 글만 보인다 */

  let commentsBlock = '';
  if(detail){
    commentsBlock = (p.comments||[]).map(c=>{
      const cu = userById(c.userId)||{username:'unknown'};
      return `<div class="comment">${avatarHTML(cu,34,false)}<div class="cbody"><b>${esc(cu.username)}</b> ${esc(c.text)}<div class="cmeta">좋아요 표시</div></div><div class="clike">♡</div></div>`;
    }).join('');
  } else {
    const n = (p.comments||[]).length;
    commentsBlock = n>0 ? `<div class="post-comments-link" data-open="${p.id}">댓글 ${n}개 모두 보기</div>` : '';
  }

  card.innerHTML = `
    <div class="post-head">
      ${avatarHTML(author,34,true)}

    ${commentsBlock}
    <div class="post-time">${esc(timeLabel(p))}</div>`;

  const uEl = card.querySelector('[data-prof]');
  if(uEl) uEl.onclick = ()=> navProfile(author.id, true);
  const openEl = card.querySelector('[data-open]');

  wireCarousel(card, imgs.length, detail ? null : ()=> navPost(p.id));

/* 게시물 사진 좌우 넘기기 — 터치 스와이프(스크롤 스냅) + 마우스 드래그 */
function wireCarousel(card, count, onTap){
  const track = card.querySelector('.post-track');
  if(!track) return;
  const countEl = card.querySelector('.post-count');
  const dots = [...card.querySelectorAll('.post-dots i')];

  const curIndex = ()=> Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  const sync = ()=>{
    const i = Math.min(count-1, Math.max(0, curIndex()));
    if(countEl) countEl.textContent = `${i+1}/${count}`;
    dots.forEach((d,k)=> d.classList.toggle('on', k===i));
  };
  track.addEventListener('scroll', ()=>{ clearTimeout(track._t); track._t=setTimeout(sync, 60); }, {passive:true});

  /* 마우스 드래그 — 한 번에 한 장만 */
  let down=false, startX=0, startLeft=0, moved=0, startIdx=0;
  track.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'touch') return;          // 터치는 브라우저 기본 스크롤에 맡긴다
    down=true; moved=0; startX=e.clientX; startLeft=track.scrollLeft; startIdx=curIndex();
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', e=>{
    if(!down) return;
    const dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    track.scrollLeft = startLeft - dx;
  });
  const endDrag = e=>{
    if(!down) return;
    down=false;
    const w = Math.max(1, track.clientWidth);
    const dx = startLeft - track.scrollLeft;            // 끈 방향(오른쪽으로 끌면 +)
    let target = startIdx;
    if(Math.abs(dx) > w*0.15) target = startIdx + (dx > 0 ? -1 : 1);   // 한 칸만 이동
    target = Math.min(count-1, Math.max(0, target));
    track.scrollTo({ left: target*w, behavior:'smooth' });
    setTimeout(sync, 300);
  };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  /* 탭하면 게시물 상세로 — 단, 끌었을 때는 무시 */
  if(onTap){
    track.addEventListener('click', ()=>{ if(moved < 8) onTap(); });
    let tx=0, ty=0;
    track.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
    track.addEventListener('touchend', e=>{
      const dx=Math.abs(e.changedTouches[0].clientX-tx), dy=Math.abs(e.changedTouches[0].clientY-ty);
      if(dx<8 && dy<8) moved = 0;
    });
  }
}

/* ================= 스토리 뷰어 ================= */
/* 계정마다 스토리가 최대 3개이므로, (계정, 스토리) 짝을 한 줄로 펼쳐서 넘긴다 */
let storyIdx = 0;
function storyFrames(){
  const out = [];
  liveStories().forEach(u=>{
    byNewest(visibleStories(u)).forEach(s=> out.push({u:u, s:s}));
  });
  return out;
}
function navStory(uid){
  const frames = storyFrames();
  const i = frames.findIndex(f=>f.u.id===uid);
  if(i<0) return;
  storyIdx = i;
  showScreen('storyScreen', true);
  renderStory();
}
function renderStory(){
  const frames = storyFrames();
  const f = frames[storyIdx];
  if(!f){ closeStory(); return; }
  const u = f.u;
  /* 진행 바는 “지금 보고 있는 계정”의 스토리 개수만큼 */
  const mine = frames.filter(x=>x.u===u);
  const pos  = mine.indexOf(f);
  $('#storyBars').innerHTML = mine.map((_,i)=>`<div class="${i===pos?'on':''}"></div>`).join('');
  $('#storyAv').innerHTML = u.avatar?`<img src="${u.avatar}">`:defaultAvatar();
  $('#storyName').innerHTML = `${esc(u.username)}${u.verified?verifiedBadge:''}`;
  $('#storyTime').textContent = timeLabel(f.s);
  const body = $('#storyBody');
  body.querySelectorAll('img').forEach(n=>n.remove());
  const im = document.createElement('img'); im.src = f.s.image;
  body.insertBefore(im, body.firstChild);
}
function stepStory(dir){
  const frames = storyFrames();
  const next = storyIdx + dir;
  if(next < 0){ closeStory(); return; }            // 첫 스토리에서 이전 → 닫기
  if(next >= frames.length){ closeStory(); return; } // 마지막에서 다음 → 닫기
  storyIdx = next; renderStory();
}

/* ================= DM ================= */
/* 20250504 → 2025년 5월 4일 / 그 밖의 입력은 적은 그대로 */
function fmtDate(v){
  const s=String(v||'').trim(); if(!s) return '';
  const m=s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(!m) return s;
  return `${Number(m[1])}년 ${Number(m[2])}월 ${Number(m[3])}일`;
}
/* 1103 → 오전 11:03,  1430 → 오후 2:30 / 그 밖의 입력은 적은 그대로 */
function fmtTime(v){
  const s=String(v||'').trim(); if(!s) return '';
  const m=s.match(/^(\d{1,2})(\d{2})$/);
  if(!m) return s;
  let h=Number(m[1]); const mm=m[2];
  if(h>23) return s;
  const ap = h<12 ? '오전' : '오후';
  h = h%12 || 12;
  return `${ap} ${h}:${mm}`;
}
function stampOf(m){
  const d=fmtDate(m.date), t=fmtTime(m.time);
  return [d,t].filter(Boolean).join(' ');
}

/* 대화 상대 = 참여자 중 “내 계정”이 아닌 쪽.
   내 계정이 바뀌면 상대와 말풍선 방향이 자동으로 뒤집힌다. */
function dmPeer(dm){
  const meId = (mainUser()||{}).id;
  const ps = dm.participants || [];
  const otherId = (ps[0] === meId) ? ps[1] : (ps[1] === meId ? ps[0] : null);
  return otherId ? userById(otherId) : null;
}
/* ---------- 단톡(3명 이상) ---------- */
function dmIsGroup(dm){ return ((dm && dm.participants) || []).length > 2; }
/* 나를 뺀 참여자 (내 계정이 없으면 참여자 전원) */
function dmOthers(dm){
  const meId = (mainUser()||{}).id;
  return ((dm && dm.participants) || []).filter(x=> x !== meId).map(userById).filter(Boolean);
}
function dmMembers(dm){ return ((dm && dm.participants) || []).map(userById).filter(Boolean); }
/* 손님 화면에 보일 대화방 이름 : 단톡은 방 이름(없으면 참여자 아이디), 1:1 은 상대 아이디 */
function dmTitle(dm){
  if(dmIsGroup(dm)) return (dm.name || '').trim() || dmOthers(dm).map(u=>u.username).join(', ') || '그룹 대화';
  const p = dmPeer(dm);
  return p ? p.username : '대화';
}
/* 관리자 목록용 이름 (내 계정과 상관없이 늘 같게 보인다) */
function dmAdminLabel(dm){
  const names = dmMembers(dm).map(u=>'@'+u.username);
  if(dmIsGroup(dm)) return ((dm.name||'').trim() || '단톡방') + ' — ' + names.join(', ');
  return names.join('  ↔  ') || '대화';
}
/* 단톡 프로필 : 사진 두 장을 겹쳐 놓는다 (인스타그램 방식) */
function avatarStackHTML(users, size){
  const us = (users||[]).slice(0,2);
  if(us.length < 2) return avatarHTML(us[0]||null, size, false);
  const s = Math.round(size*0.68);
  const inner = u => (u && u.avatar) ? `<img src="${u.avatar}">` : defaultAvatar();
  return `<div class="av-stack" style="width:${size}px;height:${size}px">
    <div style="width:${s}px;height:${s}px;left:0;top:0">${inner(us[0])}</div>
    <div style="width:${s}px;height:${s}px;right:0;bottom:0">${inner(us[1])}</div></div>`;
}
function dmAvatarHTML(dm, size){
  return dmIsGroup(dm) ? avatarStackHTML(dmOthers(dm), size) : avatarHTML(dmPeer(dm)||null, size, false);
}
/* 내 계정이 참여한 대화만 손님 화면에 보인다 */
function myDMs(){
  const meId = (mainUser()||{}).id;
  return L().dms.filter(dm=> visibleHere(dm) && (dm.participants||[]).indexOf(meId) >= 0);
}
function navDMList(){ showScreen('dmListScreen', true); $('#dmListTitle').textContent = (mainUser()||{}).username || ''; renderDMList(); }
function renderDMList(){
  const box=$('#dmListScroll'); box.innerHTML='';
  const tb=$('#tabbarDM'); tb.innerHTML=tabbarHTML('dm'); wireTabbar(tb);
  const list = myDMs();
  if(!list.length){ const e=document.createElement('div'); e.className='empty'; e.textContent='대화가 없습니다.'; box.appendChild(e); return; }
  list.forEach(dm=>{

    /* 단톡은 마지막으로 말한 사람 이름을 앞에 붙인다 */
    if(last && dmIsGroup(dm)){

      const meId = (mainUser()||{}).id;
      if(su) lastText = (last.fromId===meId ? '나' : su.username) + ': ' + lastText;
    }
    /* 활동중·읽음 문구 없이, 마지막 메시지만 */
    const it=document.createElement('div'); it.className='dm-item';
    it.innerHTML = `${dmAvatarHTML(dm,56)}<div class="dm-meta"><div class="dm-name">${esc(dmTitle(dm))}</div><div class="dm-last">${esc(lastText)}</div></div>`;
    it.onclick = ()=> navDMThread(dm.id);

let curDM=null;
const dmShareIcon = `<span class="dm-share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></span>`;
function navDMThread(dmid){
  curDM=dmid; showScreen('dmThreadScreen', true);
  const dm=L().dms.find(d=>d.id===dmid);
  const meId=(mainUser()||{}).id;
  const group = dmIsGroup(dm);
  const u=dmPeer(dm)||{username:'unknown'};
  /* 머리글 : 단톡은 겹친 사진 + 방 이름 + 인원수 */
  if(group){
    const av=$('#dmThreadAv');
    av.innerHTML = avatarStackHTML(dmOthers(dm), 34);
    $('#dmThreadName').innerHTML = `${esc(dmTitle(dm))} <span style="color:#8e8e8e;font-weight:400">${dmMembers(dm).length}</span><span class="after">›</span>`;
  } else {
    $('#dmThreadAv').innerHTML = u.avatar?`<img src="${u.avatar}">`:defaultAvatar();
    $('#dmThreadName').innerHTML = `${esc(u.username)}${u.verified?verifiedBadge:''}<span class="after">›</span>`;
  }
  const box=$('#dmThreadScroll'); box.innerHTML='';
  let prevStamp='', prevFrom='';
  dm.messages.forEach(m=>{
    const st = stampOf(m);
    if(st && st !== prevStamp){
      const s=document.createElement('div'); s.className='dm-stamp'; s.textContent=st;
      box.appendChild(s); prevStamp=st; prevFrom='';
    }
    const isMine = (m.fromId === meId);
    const sender = userById(m.fromId) || (isMine ? null : u);
    /* 단톡에서 상대가 바뀌면 그 위에 보낸 사람 아이디를 적는다 */
    if(group && !isMine && m.fromId !== prevFrom){
      const n=document.createElement('div'); n.className='dm-sender';
      n.textContent = (sender && sender.username) || '';
      box.appendChild(n);
    }
    prevFrom = m.fromId;
    const row=document.createElement('div'); row.className='dm-row'+(isMine?' mine':'');
    let inner='';
    if(!isMine) inner += `<div class="dm-av">${(sender&&sender.avatar)?`<img src="${sender.avatar}">`:defaultAvatar()}</div>`;
    if(m.image) inner += `<div class="dm-img"><img src="${m.image}"></div>${dmShareIcon}`;
    else inner += `<div class="dm-bubble">${esc(m.text)}</div>`;
    row.innerHTML=inner; box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}

function themeById(nid){

  data.tree.forEach(c1=> (c1.children||[]).forEach(c2=>{ if(c2.id===nid) f=c2; }));
  return f;

function openTheme(nid){
  const n = themeById(nid); if(!n) return;
  if(n.gid !== curGid){ curGid = n.gid; viewAsId = ''; viewUserName = ''; saveView(); }
  fixView();
  adminView='list'; adminTab='users'; adminEdit=null; postFilterUser=null; importPath=null;
  if(!wideAdmin()) adminPane='list';
  applyLogo(); applyBottomPad(); renderFeed(); renderAdmin();
}
function duplicateTheme(nid){
  const n = themeById(nid); if(!n) return;
  let parent=null; data.tree.forEach(c1=>{ if((c1.children||[]).indexOf(n)>=0) parent=c1; });
  if(!parent) return;
  const base = n.name + ' 복사'; let name = base, k = 2;
  const names = []; data.tree.forEach(c1=>(c1.children||[]).forEach(c2=>names.push(c2.name)));
  while(names.indexOf(name)>=0) name = base + ' ' + (k++);
  const gid = 'g'+id();
  data.groups[gid] = deepCopy(data.groups[n.gid] || {today:'',users:[],posts:[],dms:[]});
  parent.children.splice(parent.children.indexOf(n)+1, 0, {id:id(), name:name, gid:gid});
  save(); renderAdmin();
  toast(`“${name}” 으로 복제했습니다`);
}
function deleteTheme(nid){
  const n = themeById(nid); if(!n) return;
  const g = (data.groups||{})[n.gid] || {users:[],posts:[],dms:[]};
  confirmDialog(`테마 “${n.name}” 을(를) 삭제할까요?\n계정 ${g.users.length}개 · 게시물 ${g.posts.length}개 · DM ${g.dms.length}개가 함께 사라집니다.`, ()=>{
    data.tree.forEach(c1=>{ c1.children = (c1.children||[]).filter(x=>x!==n); });
    delete data.groups[n.gid];
    if(curGid === n.gid){ curGid=''; viewAsId=''; viewThemeName=''; viewUserName=''; }
    fixView(); save(); applyLogo(); applyBottomPad(); renderFeed(); renderAdmin();
  });
}

function promptName(cur, cb){
  const v = window.prompt('이름을 입력하세요', cur);
  if(v!==null && String(v).trim()) cb(String(v).trim());

function renameNode(nid){
  let node = data.tree.find(c=>c.id===nid);
  if(!node){ data.tree.forEach(c1=> (c1.children||[]).forEach(c2=>{ if(c2.id===nid) node=c2; })); }
  if(!node) return;
  promptName(node.name, v=>{ node.name=v; save(); renderAdmin(); });

function addNode(){
  const c1=curC1();
  if(!c1){ promptName('새 지점', v=>{ data.tree.push({id:id(),name:v,children:[]}); save(); renderAdmin(); }); }
  else {
    promptName('새 테마', v=>{
      const gid = 'g'+id();
      data.groups[gid] = {today:'', users:[], posts:[], dms:[]};
      c1.children.push({id:id(), name:v, gid:gid});
      save(); renderAdmin();
      toast('테마를 만들었습니다. 열어서 계정부터 추가하세요.');
    });
  }

function deleteNode(){
  const c1=curC1(); if(!c1) return;
  const themes = c1.children||[];
  confirmDialog(`지점 “${c1.name}” 을(를) 삭제할까요?\n안에 들어있는 테마 ${themes.length}개와 그 내용이 함께 사라집니다.`, ()=>{
    themes.forEach(c2=>{ if(c2.gid) delete data.groups[c2.gid]; });
    data.tree = data.tree.filter(x=>x!==c1);
    treePath.pop();
    fixView(); save(); applyLogo(); applyBottomPad(); renderFeed(); renderAdmin();

}

function storageStatusHTML(){
  const pics = countImages(data);
  let tone = {bg:'#eef7ef', bd:'#cfe6d4', fg:'#2a6b3c'}, title = '저장 정상', body = '';
  if(saveBlocked){
    tone = {bg:'#fdeceb', bd:'#f5c6c2', fg:'#a8271c'};
    title = '저장을 멈췄습니다 (내용 보호 중)';
    body = '이 기기에 저장된 내용을 읽지 못했습니다. 잘못 덮어써서 사진이 사라지는 것을 막으려고 <b>저장을 하지 않고</b> 있습니다.<br>앱을 완전히 껐다가 다시 열어 주세요. 그래도 같으면 아래 <b>내보내기</b>로 지금 화면 내용을 먼저 백업하세요.';
  } else if(idbState === 'unavailable'){
    tone = {bg:'#fff4e0', bd:'#f0d9a8', fg:'#8a5a00'};
    title = '사진 저장 공간이 아주 작습니다';
    body = '파일을 직접 열어(file://) 실행 중이라 큰 저장소를 못 씁니다. 사진을 몇 장 넣으면 <b>저장이 안 됩니다.</b><br>폰에 설치한 앱이나 주소(http)로 연 화면에서 편집하세요.';
  } else if(lastSaveErr){
    tone = {bg:'#fdeceb', bd:'#f5c6c2', fg:'#a8271c'};
    title = '마지막 저장에 실패했습니다';
    body = `사유: ${esc(lastSaveErr)}<br>지금 내용을 <b>내보내기</b>로 먼저 백업해 주세요.`;
  } else {
    body = `이 기기에 저장됨 · 사진 <b>${pics}개</b> · 약 ${storageKB()}KB<br>사진은 앱을 껐다 켜거나 새 index.html 로 바꿔도 지워지지 않습니다.`
      + (persistState==='off'
          ? '<br><span style="color:#8a5a00">브라우저가 오래 안 쓴 앱의 저장 내용을 지울 수 있습니다. <b>홈 화면에 추가</b>해서 쓰고, 중요한 내용은 아래 <b>새 index.html 만들기</b>로 파일에 담아 두세요.</span>'
          : (persistState==='on' ? '<br>저장 보호(영구 보관) 켜짐' : ''));
  }
  let html = `<div class="asec" style="background:${tone.bg};border:1px solid ${tone.bd}">
      <h3 style="color:${tone.fg}">${title}</h3>
      <div class="hint" style="margin-top:0;color:${tone.fg}">${body}</div>`;
  if(normLoss > 0){
    html += `<div class="hint" style="margin-top:8px;color:#a8271c">정리 과정에서 사진 ${normLoss}개가 빠졌습니다. 위의 <b>직전 내용으로 되돌리기</b>로 되살릴 수 있습니다.</div>`;
  }
  if(autoPoint && autoPoint.data){
    const when = whenLabel(autoPoint.savedAt);
    html += `<div class="hint" style="margin-top:8px;background:#fff;border:1px solid #e3e7ec;border-radius:8px;padding:9px 11px;color:#5a6a7a">
        <b>자동 백업</b> · ${esc(when)} · 사진 ${countImages(autoPoint.data)}개
        <button class="btn btn-ghost btn-sm" id="restoreAuto" style="margin-top:7px;width:100%">이 시점으로 되돌리기</button>
      </div>`;
  }
  return html + `</div>`;
}

function doImportAccount(src, uid){
  const meName = (mainUser()||{}).username;

  /* 이 계정이 참여한 DM.
     그중 내 계정과 같은 아이디가 상대로 들어있는 대화가 있으면 그것만 가져온다. */
  let dms = src.dms.filter(d=> (d.participants||[]).indexOf(uid) >= 0);
  const withMe = dms.filter(d=> (d.participants||[]).some(x=>{
    const su = src.users.find(y=>y.id===x);
    return su && su.username === meName;
  }));
  const dmFiltered = withMe.length > 0;
  if(dmFiltered) dms = withMe;

  const need = new Set([uid]);
  /* 이 계정 게시물의 댓글 작성자 */
  src.posts.filter(p=>p.userId===uid).forEach(p=> (p.comments||[]).forEach(c=> need.add(c.userId)));
  /* 가져올 DM 의 상대 */
  dms.forEach(d=> (d.participants||[]).forEach(x=> need.add(x)));

  const map = {};        /* 원래 id → 이 리스트의 id */
  let added = 0;
  need.forEach(oid=>{
    const ou = src.users.find(x=>x.id===oid); if(!ou) return;
    /* 같은 아이디의 계정이 이미 있으면 새로 만들지 않고 그 계정에 연결한다.
       (내 계정과 이름이 같은 상대는 곧 “나”이므로 대화 주체가 자동으로 맞춰진다) */
    const exist = L().users.find(x=>x.username === ou.username);
    if(exist){ map[oid] = exist.id; return; }
    const copy = deepCopy(ou);
    copy.id = id(); copy.isMain = false;
    map[oid] = copy.id;
    L().users.push(copy); added++;
  });
  let np = 0;
  src.posts.filter(p=>p.userId===uid).forEach(p=>{
    const cp = deepCopy(p); cp.id = id(); cp.userId = map[p.userId];
    cp.comments = (cp.comments||[]).filter(c=>map[c.userId]).map(c=>{ c.id=id(); c.userId=map[c.userId]; return c; });
    L().posts.push(cp); np++;
  });
  let nd = 0;
  dms.forEach(d=>{
    const cd = deepCopy(d); cd.id = id();
    cd.participants = (cd.participants||[]).map(x=>map[x]).filter(Boolean);
    if(cd.participants.length < 2) return;
    (cd.messages||[]).forEach(m=>{ m.id=id(); m.fromId = map[m.fromId] || cd.participants[0]; });
    L().dms.push(cd); nd++;
  });
  /* 계정이 하나도 없던 폰이면, 가져온 첫 계정을 주인으로 잡아준다 */
  if(!viewAsId && L().users.length){ setViewAs(L().users[0].id); }
  save(); renderFeed();
  importPath = null;
  closeEdit();
  toast(`계정 ${added}개 · 게시물 ${np}개 · DM ${nd}개 가져옴${dmFiltered?` (내 계정 @${meName} 대화만)`:''}`);
}

/* ----- 게시물 관리 ----- */

          <div><div class="nm">@${esc(au.username)}</div><div class="sub">${esc(timeLabel(p))} · 사진 ${n}장 · 좋아요 ${fmtNum(p.likes)} · 댓글 ${(p.comments||[]).length}</div></div>

      </div></div>`;

function editPost(pid){ openEdit('post', pid); }

/* 게시물 사진 여러 장 편집 */
function renderPostPics(p, pid){
  const box=$('#picGrid'); if(!box) return;
  p.images = p.images || [];
  box.innerHTML = p.images.map((src,i)=>`
    <div class="pic-cell">
      <div class="pic-big" data-pic="${i}"><img src="${src}"></div>
      <span class="pic-no">${i+1}</span>
      <div class="pic-tools">
        <button class="btn btn-ghost btn-sm" data-pleft="${i}" ${i===0?'disabled':''}>◀</button>
        <button class="btn btn-ghost btn-sm" data-pright="${i}" ${i===p.images.length-1?'disabled':''}>▶</button>
        <button class="btn btn-danger btn-sm" data-pdel="${i}">✕</button>
      </div>
    </div>`).join('')
    + (p.images.length < MAX_POST_IMAGES
        ? `<div class="pic-cell"><div class="pic-add" id="picAdd"><b>＋</b>사진 추가</div></div>` : '');

  const redraw = ()=>{ save(); editPost(pid); };
  const add=box.querySelector('#picAdd');
  if(add) add.onclick=()=> pickImage(1080, url=>{ p.images.push(url); redraw(); });
  box.querySelectorAll('[data-pic]').forEach(el=> el.onclick=()=> pickImage(1080, url=>{ p.images[Number(el.dataset.pic)]=url; redraw(); }));
  box.querySelectorAll('[data-pdel]').forEach(b=> b.onclick=()=>{ p.images.splice(Number(b.dataset.pdel),1); redraw(); });
  box.querySelectorAll('[data-pleft]').forEach(b=> b.onclick=()=>{ const i=Number(b.dataset.pleft); [p.images[i-1],p.images[i]]=[p.images[i],p.images[i-1]]; redraw(); });
  box.querySelectorAll('[data-pright]').forEach(b=> b.onclick=()=>{ const i=Number(b.dataset.pright); [p.images[i+1],p.images[i]]=[p.images[i],p.images[i+1]]; redraw(); });
}

/* ----- DM 관리 ----- */
function renderAdminDMs(){
  const sec=$('#adminSec');
  if(!L().users.length){ sec.innerHTML=`<div class="asec"><div class="hint">먼저 “사용자” 탭에서 사용자를 추가하세요.</div></div>`; return; }
  let html=`<div class="asec"><h3>DM 대화 <span style="display:flex;gap:6px">
      <button class="btn btn-dark btn-sm" id="addDM">＋ 1:1</button>
      <button class="btn btn-dark btn-sm" id="addGroupDM">＋ 단톡</button></span></h3>`;
  if(!L().dms.length) html+=`<div class="hint">대화가 없습니다.</div>`;
  L().dms.forEach(dm=>{
    const group = dmIsGroup(dm);
    html += `<div class="alist-item"><div class="top">
      <div class="nm">${group?'👥 ':''}${esc(dmAdminLabel(dm))}</div>
      <button class="btn btn-ghost btn-sm" data-edm="${dm.id}">편집</button>
    </div><div class="sub">${group?`단톡방 · 참여자 ${(dm.participants||[]).length}명 · `:''}메시지 ${dm.messages.length}개${(dm.only&&dm.only.length)?' · 👁 일부 계정만':''}</div></div>`;
  });
  html+=`<div class="hint">대화에는 <b>참여한 계정</b>이 저장됩니다. 그래서 “내 계정”을 바꾸면 같은 대화가 <b>그 사람 시점</b>으로 자동으로 뒤집혀 보입니다.<br>
    참여자가 <b>3명 이상이면 단톡방</b>이 되고, 방 이름을 직접 정할 수 있습니다.<br>손님 화면에는 내 계정이 참여한 대화만 나옵니다.</div></div>`;
  sec.innerHTML=html;
  $('#addDM').onclick=()=>{
    const me=mainUser()||L().users[0]; if(!me){ toast('먼저 계정을 추가하세요'); return; }
    const other=L().users.find(u=>u!==me)||me;
    const dm={id:id(),name:'',participants:[me.id, other.id],only:[],messages:[]}; L().dms.push(dm); save(); editDM(dm.id);
  };
  $('#addGroupDM').onclick=()=>{
    const us=L().users;
    if(us.length < 3){ toast('단톡방은 계정이 3개 이상일 때 만들 수 있습니다'); return; }
    const me=mainUser()||us[0];
    const rest=us.filter(u=>u!==me).slice(0,2);
    const dm={id:id(), name:'단톡방', participants:[me.id, ...rest.map(u=>u.id)], only:[], messages:[]};
    L().dms.push(dm); save(); editDM(dm.id);
  };
  sec.querySelectorAll('[data-edm]').forEach(b=> b.onclick=()=> editDM(b.dataset.edm));
}
function editDM(dmid){ openEdit('dm', dmid); }
function renderEditDM(dmid){
  const dm=L().dms.find(d=>d.id===dmid); if(!dm){ closeEdit(); return; }
  const sec=$('#paneEdit');
  dm.participants = dm.participants || [];
  const group = dmIsGroup(dm);
  const notIn = L().users.filter(u=> dm.participants.indexOf(u.id) < 0);
  const rows = dm.participants.map((pid,i)=>{
    const u = userById(pid);
    return `<div class="sub-item" style="display:flex;align-items:center;gap:9px;padding:8px 9px">
        ${avatarHTML(u,30,false)}
        <div style="flex:1;min-width:0;font-size:13px;font-weight:600">@${esc(u?u.username:'?')}</div>
        ${(pid===viewAsId)?'<span style="font-size:11px;color:#0095f6;font-weight:700">내 계정</span>':''}
        <button class="btn btn-ghost btn-sm" data-pup="${i}" ${i===0?'disabled':''}>▲</button>
        <button class="btn btn-danger btn-sm" data-pdel="${i}" ${dm.participants.length<=2?'disabled':''}>빼기</button>
      </div>`;
  }).join('');
  sec.innerHTML = `
    <button class="btn btn-ghost btn-sm pane-back" id="backDMs" style="margin-bottom:12px">‹ 목록으로</button>
    <div class="asec">
      <h3>${group?'단톡방':'대화'} 참여자 <span style="font-size:11px;color:#8a97a5;font-weight:400">${dm.participants.length}명</span></h3>
      ${group?`<div class="field"><label>단톡방 이름 (목록·대화 위에 표시)</label>
          <input id="dm-name" value="${esc(dm.name||'')}" placeholder="예) 그날 밤 멤버"></div>`:''}
      ${rows}
      ${notIn.length?`<div class="add-row"><select id="dm-addwho">${notIn.map(u=>`<option value="${u.id}">@${esc(u.username)}</option>`).join('')}</select>
          <button class="btn btn-dark btn-sm right" id="dm-addp">＋ 참여자 추가</button></div>`
        :`<div class="hint" style="margin-top:8px">모든 계정이 이미 참여하고 있습니다.</div>`}
      <div class="hint">참여자가 <b>3명 이상이면 단톡방</b>이 됩니다.<br>
        “내 계정”인 사람이 오른쪽(보라 그라데이션)에 표시되고, 내 계정을 바꾸면 이 대화도 자동으로 그 시점으로 뒤집힙니다.</div>
      ${onlyFieldsHTML(dm, 'dm')}
    </div>
    <div class="asec">
      <h3>대화 내용</h3>
      <div class="hint" style="margin-top:0;margin-bottom:10px">날짜는 <b>20250504</b> → 2025년 5월 4일, 시간은 <b>1103</b> → 오전 11:03 으로 바뀝니다.<br>(그대로 적고 싶으면 “7월 18일”, “오후 9:32” 처럼 적으면 됩니다)</div>
      <div id="dmMsgList"></div>
      <div class="add-row" id="dmAddRow"></div>
    </div>
    <div class="asec"><button class="btn btn-danger btn-block" id="dm-del">이 대화 삭제</button></div>`;
  $('#backDMs').onclick=()=>{ save(); closeEdit(); };
  wireOnlyFields(dm, 'dm', ()=> renderAdminDMs());
  const nm=$('#dm-name'); if(nm) nm.oninput=e=>{ dm.name=e.target.value; save(); };
  sec.querySelectorAll('[data-pdel]').forEach(b=> b.onclick=()=>{
    const i=Number(b.dataset.pdel), pid=dm.participants[i];
    dm.participants.splice(i,1);
    /* 빠진 사람이 보낸 메시지는 남은 첫 사람 이름으로 옮겨 둔다 (메시지를 잃지 않게) */
    dm.messages.forEach(m=>{ if(m.fromId===pid) m.fromId = dm.participants[0]; });
    if(dm.participants.length <= 2) dm.name = '';      /* 둘만 남으면 1:1 대화로 */
    save(); editDM(dmid); renderAdminDMs();
  });
  sec.querySelectorAll('[data-pup]').forEach(b=> b.onclick=()=>{
    const i=Number(b.dataset.pup);
    if(i>0){ [dm.participants[i-1],dm.participants[i]]=[dm.participants[i],dm.participants[i-1]]; save(); editDM(dmid); }
  });
  const ap=$('#dm-addp');
  if(ap) ap.onclick=()=>{
    const v=$('#dm-addwho').value; if(!v) return;
    if(dm.participants.indexOf(v)<0) dm.participants.push(v);
    if(dmIsGroup(dm) && !dm.name) dm.name = '단톡방';
    save(); editDM(dmid); renderAdminDMs();
  };
  $('#dm-del').onclick=()=> confirmDialog('이 대화를 삭제할까요?', ()=>{ L().dms=L().dms.filter(d=>d.id!==dmid); save(); closeEdit(); renderAdminDMs(); });
  renderDMMsgEditors(dm, dmid);
}
/* 대화 편집에서 “나”로 볼 사람 : 이 기기에서 고른 계정이 참여 중이면 그 사람, 아니면 첫 참여자 */
function dmEditorMe(dm){
  const ps = dm.participants || [];
  return (ps.indexOf(viewAsId) >= 0) ? viewAsId : (ps[0] || '');
}
/* 메시지 추가 버튼 (카카오톡처럼 목록 아래에 둔다) */
function renderDMAddRow(dm, dmid){
  const row=$('#dmAddRow'); if(!row) return;
  const meId = dmEditorMe(dm);
  const me = userById(meId);
  const others = (dm.participants||[]).filter(x=> x!==meId).map(userById).filter(Boolean);
  const last = dm.messages[dm.messages.length-1];
  const lastOther = (last && last.fromId!==meId) ? last.fromId : ((others[0]||{}).id||'');
  row.innerHTML = `
    <div class="left">
      ${others.length>1?`<select id="dmAddWho">${others.map(u=>`<option value="${u.id}" ${u.id===lastOther?'selected':''}>@${esc(u.username)}</option>`).join('')}</select>`:''}
      <button class="btn btn-ghost btn-sm" id="dmAddOther">＋ ${others.length>1?'상대 메시지':'@'+esc((others[0]||{}).username||'상대')}</button>
    </div>
    <button class="btn btn-dark btn-sm right" id="dmAddMine">＋ @${esc(me?me.username:'나')}</button>`;
  const push = who=>{
    if(!who){ toast('참여자를 먼저 추가하세요'); return; }
    const prev = dm.messages[dm.messages.length-1];
    dm.messages.push({id:id(), fromId:who, text:'', image:'', date:'', time: prev?prev.time:''});
    save(); renderDMMsgEditors(dm, dmid);
    const box=$('#dmMsgList'); const el=box?box.lastElementChild:null;
    if(el){ el.scrollIntoView({block:'center'}); const ta=el.querySelector('[data-mf="text"]'); if(ta) ta.focus(); }
  };
  const ao=$('#dmAddOther');
  if(ao) ao.onclick=()=>{ const s=$('#dmAddWho'); push(s? s.value : ((others[0]||{}).id||'')); };
  const am=$('#dmAddMine'); if(am) am.onclick=()=> push(meId);
}
function renderDMMsgEditors(dm, dmid){
  const box=$('#dmMsgList'); box.innerHTML='';
  renderDMAddRow(dm, dmid);
  if(!dm.messages.length){ box.innerHTML=`<div class="hint">메시지가 없습니다. 아래 <b>＋</b> 버튼으로 추가하세요.</div>`; return; }
  const meId = dmEditorMe(dm);
  dm.messages.forEach((m,i)=>{
    const su = userById(m.fromId);
    const mine = (m.fromId === meId);
    /* 보낸 사람이 “나”면 오른쪽, 아니면 왼쪽 — 손님 화면과 같은 방향 */
    const ed=document.createElement('div'); ed.className='msg-ed'+(mine?' mine':'');
    ed.innerHTML = `
      <div class="who">@${esc(su?su.username:'?')}${mine?' (내 계정)':''}</div>
      <div class="frow" style="margin-bottom:6px;align-items:center">
        <select data-mf="from">${(dm.participants||[]).map(x=>{ const u=userById(x); return `<option value="${x}" ${m.fromId===x?'selected':''}>@${esc(u?u.username:'?')}</option>`; }).join('')}</select>
        <input data-mf="date" placeholder="20250504" value="${esc(m.date||'')}">
        <input data-mf="time" placeholder="1103" value="${esc(m.time||'')}">
      </div>
      <div style="font-size:11.5px;color:#98a5b2;margin:-2px 0 6px">표시 : <span data-prev>${esc(stampOf(m))||'<span style="color:#c3ccd4">날짜·시간 없음</span>'}</span></div>

        <div class="thumb-pick" data-mimg="${i}" style="width:44px;height:44px">${m.image?`<img src="${m.image}">`:'사진'}</div>
